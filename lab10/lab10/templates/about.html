{% extends 'base.html' %}

{% block title %}About Us{% endblock %}

{% block msg %}About Us{% endblock %}

{% block content %}
<h2>Images</h2>
<div class="image-gallery">
    {% for image in images %}
        <img src="{{ url_for('static', filename='images/' + image) }}"
             alt="{{ image }}"
             width="200">
    {% endfor %}
</div>
{% endblock %}
